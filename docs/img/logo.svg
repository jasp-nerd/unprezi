<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="unprezi">
  <defs>
    <linearGradient id="g" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#39a0ff"/>
    </linearGradient>
  </defs>
  <!-- nested frames collapsing toward one flat page: Prezi's zoom, flattened -->
  <rect x="6" y="6" width="52" height="52" rx="13" stroke="url(#g)" stroke-width="3" opacity="0.3"/>
  <rect x="6" y="6" width="35" height="35" rx="10" stroke="url(#g)" stroke-width="3" opacity="0.6"/>
  <rect x="6" y="6" width="19" height="19" rx="6" fill="url(#g)"/>
</svg>
